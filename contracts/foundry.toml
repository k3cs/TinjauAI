[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "paris"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "usc/=lib/usc/",
]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
cc3 = "https://rpc.cc3-testnet.creditcoin.network"
