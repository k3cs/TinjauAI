[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = ["usc/=lib/usc/", "forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
cc3 = "https://rpc.cc3-testnet.creditcoin.network"
